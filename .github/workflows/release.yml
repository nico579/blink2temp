name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Vérifier VERSION et le tag
        run: python android/tools/check_versions.py

  android:
    needs: versions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      # Même clé que gpx2elev : le fichier n'est jamais versionné, il est
      # restauré depuis le secret GitHub puis supprimé en fin de tâche.
      - name: Restore project signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          chmod 600 app/debug.keystore
      - name: Tests, lint, APK et AAB release signés
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --console=plain --no-daemon --max-workers=2
      - name: Vérifier l'identifiant, la signature et la version
        working-directory: android
        run: python tools/package_android.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: android/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        working-directory: android
        run: rm -f app/debug.keystore

  bundles:
    name: Bundle (${{ matrix.artifact }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: windows-x64
          - runner: ubuntu-22.04
            artifact: linux-x64
          - runner: macos-15-intel
            artifact: macos-x64
          - runner: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Exécutable construit et vérifié
        run: python tools/build_bundle.py
      - name: Archive et empreintes
        run: python tools/package_bundle.py --artifact "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [android, bundles]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: "{android,bundle-*}"
          merge-multiple: true
      - name: Publier le matériel vérifié
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat release-assets/SHA256SUMS-*.txt | tr -d '\r' > release-assets/SHA256SUMS.txt
          cd release-assets
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
          sha256sum -c SHA256SUMS.txt
          cd ..
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Blink2Temp $RELEASE_TAG" \
              --notes-file android/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
